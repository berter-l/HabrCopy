services:
  app:
    build:
      context: .
      dockerfile: Dockerfile_app
    image: test-app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18.6
    volumes:
      - db_volumes:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_USER=test_app
      - POSTGRES_DB=test_app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    container_name: ai

    build:
      context: .
      dockerfile: Dockerfile_ai

    healthcheck:
      test: [ "CMD", "ollama", "show", "gemma2:2b" ]
      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 30s

    environment:
      - OLLAMA_HOST=0.0.0.0
      - GIN_MODE=release

  redis:
    container_name: redis
    image: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 10s
      retries: 3
      timeout: 5s
    volumes:
      - "redis_data:/data"


volumes:
  db_volumes:
  redis_data:
